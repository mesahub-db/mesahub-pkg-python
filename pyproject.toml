[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "mesahub"
version = "1.0.0"
description = "Python SDK for mesahub — access SQLite databases from Python"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
keywords = ["sqlite", "database", "mesahub", "sdk"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
]
dependencies = [
    "httpx>=0.27.0",
]

[project.urls]
Homepage = "https://mesahub.app"
Repository = "https://github.com/mesahub-db/mesahub-pkg-python"

[tool.hatch.build.targets.wheel]
packages = ["mesahub"]
